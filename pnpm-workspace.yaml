packages:
  - 'packages/*'
  - 'apps/*'

minimumReleaseAgeExclude:
  - executable-stories-vitest
  - executable-stories-formatters
  - executable-stories-react

allowBuilds:
  esbuild: true
  workerd: true

overrides:
  nanoid@<3.3.18: 3.3.18
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  svgo@>=4.0.0 <4.1.0: ^4.1.0
  devalue@<5.9.1: ^5.9.1
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  hono@<4.13.5: ^4.13.5
  sharp@<0.35.4: ^0.35.4
  lodash-es@<4.18.1: ^4.18.1
  undici@>=8.1.0 <8.10.2: ^8.10.2

# No http-cache-semantics release fixes GHSA-ch52-4w7c-c8xp yet (4.2.0 is the
# latest). It reaches this repo only through Astro in the private docs site,
# which builds static pages; no published package depends on it.
auditConfig:
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp
