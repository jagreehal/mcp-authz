[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-authz"
version = "0.2.0"
description = "Authorization for MCP Python servers: OAuth resource server, policy, and permission-gated capabilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jag Reehal", email = "jag@jagreehal.com" }]
keywords = ["mcp", "model-context-protocol", "oauth", "authorization", "rbac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "PyJWT[crypto]>=2.10.1,<3",
]

[project.urls]
Homepage = "https://github.com/jagreehal/mcp-authz"
Repository = "https://github.com/jagreehal/mcp-authz.git"
Issues = "https://github.com/jagreehal/mcp-authz/issues"

[project.optional-dependencies]
dev = [
    "build>=1.3",
    "httpx>=0.28",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_authz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib --cov=mcp_authz --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
